<script>
(() => {
'use strict';
const EMMA = 'Emma App';
const S = {emma:{status:'loading'}, spend:{status:'loading'}, recur:{status:'loading'}, tx:{status:'loading'}, pay:{status:'loading'}, hist:[], histDone:false,
  holdings:[], cards:{}, budgets:{}, rules:{}, prefix:[], guess:{}, over:{}, receipts:{}, orders:{}, mail:'', inv:'', loans:[], split:[], facts:[], factEdit:null, subs:{}, tile:null, thinking:0, snaps:[], dbOk:false, openCat:null, spike:null, nwView:(() => { try { return localStorage.getItem('tally.nwView') || 'bar'; } catch (_) { return 'bar'; } })(), explaining:null, chat:{}, an:{mode:'todate', a:0, b:-1, cat:null}, txFilter:'', txCat:''};
let mcp = null, db = null, sample = null, CH = null, G = null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = (n, dp) => { const d = dp ?? (Math.abs(n) >= 1000 ? 0 : 2); return (n < 0 ? '−' : '') + '£' + Math.abs(n).toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d}); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const pd = (s) => new Date(s + 'T00:00:00');
const dShort = (d) => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const ordinal = (n) => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
const DAY = 86400000;
const bid = (n) => String(n).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 120) || 'x';
const NOT_SPEND = {Income:1, Transfer:1, Excluded:1};
const MERGE = {'General': 'Unsure', 'Pubs': 'Eating Out & Pubs', 'Eating Out': 'Eating Out & Pubs'};
const norm = (c) => (c && MERGE[c]) || c;
const BASE_CATS = ['Rent','Groceries','Eating Out & Pubs','Transport','Shopping','Bills','Entertainment','Holidays','Personal Care','Motorbike','Gifts','Health (family pays)','House (shared)','Subscriptions','Unsure'];

const EMO = {'Unsure':'🤷','Subscriptions':'🔁','House (shared)':'🧺','Rent':'🏠','Groceries':'🛒','Eating Out & Pubs':'🍻','Transport':'🚇','Shopping':'🛍️','Bills':'🧾','Entertainment':'🎟️','Holidays':'✈️','Personal Care':'💈','Motorbike':'🏍️','Gifts':'🎁','Health (family pays)':'🩺','Income':'💷','General':'❓'};
const EMO_KW = [[/rent|home|house|mortgage/, '🏠'], [/grocer|supermarket|food shop/, '🛒'], [/eat|restaurant|dining|takeaway|lunch|dinner/, '🍽️'], [/coffee|cafe/, '☕'], [/pub|bar|drink|beer|wine/, '🍺'], [/transport|travel card|train|tube|taxi|fuel|petrol|car/, '🚇'], [/shop|cloth/, '🛍️'], [/bill|utilit|subscription|insurance|phone|internet/, '🧾'], [/entertain|fun|cinema|gig|ticket|music/, '🎟️'], [/holiday|trip|flight|travel|hotel/, '✈️'], [/hair|care|beauty|gym|fitness/, '💈'], [/moto|bike/, '🏍️'], [/gift|present|charit|donat/, '🎁'], [/health|medical|therap|doctor|dent|pharm/, '🩺'], [/loan|lent|friend/, '🤝'], [/pet|dog|cat/, '🐾'], [/book|educat|course/, '📚'], [/tax|fee|bank/, '🏦'], [/sav|invest|pension/, '📈'], [/kid|child|family/, '👨‍👩‍👧']];
const emo = (c) => { if (!c) return ''; if (EMO[c]) return EMO[c]; const t = String(c).toLowerCase(); for (const k of EMO_KW) if (k[0].test(t)) return k[1]; return ''; };
const cl = (c) => { const e = emo(c); return esc(c) + (e ? ' <span aria-hidden="true">' + e + '</span>' : ''); };

/* ---------- connector calls ---------- */
const errCopy = (e) => {
  const c = e && e.code;
  if (c === 'needs_reauth') return 'Emma needs signing in again. Reconnect it in claude.ai Settings → Connectors, then press Refresh.';
  if (c === 'server_not_connected' || c === 'selection_required') return 'Add the Emma connector in claude.ai Settings → Connectors to see this.';
  if (c === 'not_in_manifest') return 'Emma is turned off for this page. Allow it in the page’s connector settings to see this.';
  if (c === 'blocked_by_policy' || c === 'approval_required') return 'Your organization’s settings block Emma here.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Live data isn’t available in this view. Open Tally on claude.ai to load your accounts.';
  if (c === 'server_unavailable') return 'Emma didn’t answer just now. Press Refresh in a minute.';
  if (c === 'tool_error') return 'Emma reported a problem: ' + (e.message || 'no details');
  return 'Emma couldn’t be reached (' + (c || 'unknown error') + '). Press Refresh to try again.';
};
const unwrap = (p) => {
  if (p && typeof p === 'object' && typeof p.result === 'string') { try { return JSON.parse(p.result); } catch (_) {} }
  if (typeof p === 'string') { try { return JSON.parse(p); } catch (_) {} }
  return p;
};
async function call(tool, input, refresh, stale) {
  const r = await mcp.callTool(EMMA, tool, input, {cache: {staleTime: stale || 300000, gcTime: 86400000, refresh: !!refresh}});
  return {data: unwrap(r.payload), at: r.cache ? r.cache.storedAt : Date.now()};
}
async function guarded(key, fn) {
  if (!mcp) { S[key] = {status:'error', msg: errCopy({code:'not_granted'})}; render(); return; }
  try { const r = await fn(); S[key] = {status:'ok', data:r.data, at:r.at}; }
  catch (e) {
    if (e && e.retryable) {
      await new Promise(res => setTimeout(res, Math.min(e.retryAfterMs || 1500 + Math.random() * 1500, 8000)));
      try { const r = await fn(); S[key] = {status:'ok', data:r.data, at:r.at}; render(); return; } catch (e2) { e = e2; }
    }
    const deny = ['needs_reauth','server_not_connected','not_in_manifest','blocked_by_policy','approval_required'].includes(e && e.code);
    const prev = S[key];
    S[key] = (!deny && prev.data) ? {status:'stale', data:prev.data, at:prev.at, msg:errCopy(e)} : {status:'error', msg:errCopy(e)};
  }
  render();
}
async function fetchRange(from, to, extra, refresh, maxPages, slow) {
  const base = Object.assign({from: iso(from), to: iso(to)}, extra);
  const first = await call('search_transactions', Object.assign({page: 1}, base), slow ? false : refresh, slow ? 86400000 : 0);
  let all = (first.data && first.data.transactions) || [];
  const pages = Math.min((first.data && first.data.pages) || 1, maxPages || 12);
  if (slow) { for (let p = 2; p <= pages; p++) { const r = await call('search_transactions', Object.assign({page: p}, base), false, 86400000); all = all.concat((r.data && r.data.transactions) || []); } }
  else { const rest = [];
    for (let p = 2; p <= pages; p++) rest.push(call('search_transactions', Object.assign({page: p}, base), refresh));
    (await Promise.all(rest)).forEach(r => { all = all.concat((r.data && r.data.transactions) || []); }); }
  return {data: {transactions: all, partial: ((first.data && first.data.pages) || 1) > pages}, at: first.at};
}
function monthBounds(back) { const t = today(); return {from: new Date(t.getFullYear(), t.getMonth() - back, 1), to: back ? new Date(t.getFullYear(), t.getMonth() - back + 1, 0) : t, len: new Date(t.getFullYear(), t.getMonth() - back + 1, 0).getDate()}; }
const HIST_WAIT = window.__histWait || 25000;
/* Finished months don't change, so once read from Emma they are kept in Tally's own database and never asked for again. */
const HIST = {}; let histResolve; const histReady = new Promise(res => { histResolve = res; setTimeout(res, 6000); });
async function histSaved(key) {
  await histReady; const meta = HIST[key]; if (!meta || !meta.n) return null;
  let all = []; for (let i = 0; i < meta.n; i++) { const c = HIST[key + '_' + i]; if (!c || !Array.isArray(c.txs)) return null; all = all.concat(c.txs); }
  return all;
}
async function histSave(key, txs) {
  if (!db || !S.dbOk) return;
  try { const n = Math.max(1, Math.ceil(txs.length / 80));
    for (let i = 0; i < n; i++) await db.doc('history/' + key + '_' + i).set({txs: txs.slice(i * 80, i * 80 + 80)});
    await db.doc('history/' + key).set({n, count: txs.length, savedAt: new Date().toISOString()}); } catch (_) {}
}
async function loadHist(refresh) {
  if (!mcp) return;
  S.histShort = null;
  const out = [];
  for (let b = 1; b <= 6; b++) {
    const m = monthBounds(b);
    /* Emma limits how fast it can be read: earlier months are fetched one page at a time, and a refusal means wait and try again, not give up. */
    const key = iso(m.from).slice(0, 7), saved = await histSaved(key);
    if (saved) { out.push({len: m.len, label: m.from.toLocaleDateString('en-GB', {month:'short'}), txs: saved}); S.hist = out.slice(); render(); continue; }
    let ok = false;
    for (let tries = 0; tries < 4 && !ok; tries++) {
      try { const r = await fetchRange(m.from, m.to, {excludeTransfers: true}, refresh, 12, true); out.push({len: m.len, label: m.from.toLocaleDateString('en-GB', {month:'short'}), txs: r.data.transactions}); S.hist = out.slice(); S.histWait = false; ok = true; render(); if (!r.data.partial && +today() - +m.to > 5 * DAY) histSave(key, r.data.transactions); }
      catch (e) { if (['needs_reauth','server_not_connected','not_in_manifest','blocked_by_policy','approval_required'].includes(e && e.code) || tries === 3) break; S.histWait = true; render(); await new Promise(res => setTimeout(res, HIST_WAIT * (tries + 1))); }
    }
    if (!ok) { S.histShort = b - 1; break; }
  }
  S.histWait = false; S.histDone = true; render();
}
async function loadPay(refresh) {
  const refs = emmaAccounts().filter(a => a.type === 'credit_card').map(a => a.reference).slice(0, 10);
  if (!refs.length) { S.pay = {status:'ok', data:{transactions:[]}}; return; }
  const t = today();
  await guarded('pay', () => fetchRange(new Date(+t - 100 * DAY), t, {accounts: refs, minAmount: 20}, refresh, 3));
}
async function loadAll(refresh) {
  ['emma','spend','recur','tx','pay'].forEach(k => { if (!S[k].data) S[k] = {status:'loading'}; });
  render();
  const m = monthBounds(0);
  guarded('spend', () => call('get_spending', {groupBy:'category', period:'current', periods:4}, refresh));
  guarded('recur', () => call('list_recurring_payments', {}, refresh));
  const txp = guarded('tx', () => fetchRange(m.from, m.to, {excludeTransfers: true}, refresh, 12));
  await guarded('emma', () => call('list_accounts', {}, refresh));
  loadPay(refresh);
  await txp;
  loadHist(refresh);
}

/* ---------- accounts ---------- */
function emmaAccounts() {
  const d = S.emma.data; if (!d || !d.spaces) return [];
  const out = [];
  d.spaces.forEach(sp => (sp.accounts || []).forEach(a => { if (!a.hidden && !a.closed) out.push(Object.assign({}, a, {gbp: a.balanceInMainCurrency ? a.balanceInMainCurrency.balance : a.balance})); }));
  return out;
}
const isInvType = (t) => /invest|pension|isa|stock|brokerage|retire/i.test(t || '');
function totals() {
  const acc = emmaAccounts();
  const sum = (f) => acc.filter(f).reduce((s, a) => s + a.gbp, 0);
  const hs = (k) => S.holdings.filter(h => (h.kind || 'investment') === k).reduce((s, h) => s + (+h.value || 0), 0);
  const everyday = sum(a => a.type === 'current'), savings = sum(a => a.type === 'savings');
  const cards = sum(a => a.type === 'credit_card'), debt = sum(a => /loan|mortgage/i.test(a.type));
  const inv = hs('investment') + sum(a => isInvType(a.type) && !/pension/i.test(a.type));
  const pen = hs('pension') + sum(a => /pension/i.test(a.type));
  const lent = loansOwed() + S.split.reduce((s, f) => s + (+f.gbp || 0), 0), other = hs('asset') + lent;
  return {everyday, savings, cash: everyday + savings, cards, debt, inv, pen, other, lent, net: everyday + savings + cards + debt + inv + pen + other};
}

/* ---------- learning: rules applied to transactions ---------- */
const keyOf = (x) => String(x.merchant || x.name || '').split(/\*|\(fee/i)[0].toLowerCase().replace(/['’]/g, '').replace(/^(from|to) /, '').replace(/[^a-z& ]+/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 2).join(' ');
const dirOf = (x) => x.amount < 0 ? 'out' : 'in';
const qid = (x) => dirOf(x) + '_' + bid(keyOf(x));
function ruleFor(x) {
  const k = keyOf(x), dir = dirOf(x); if (!k) return undefined;
  const r = S.rules[dir + '_' + bid(k)]; if (r) return r;
  for (const p of S.prefix) if (p.dir === dir && (k === p.key || k.startsWith(p.key + ' '))) return p;
  if (dir === 'in') { const o = S.rules['out_' + bid(k)]; if (o && o.action === 'loan') return o; }
  return undefined;
}
/* A payment is worth a second look when Emma couldn't place it, or when money in might not be income. */
function candidate(x) {
  const name = x.merchant || x.name || '';
  return x.amount < 0 ? x.category === 'General' : (x.category === 'Income' && !/interest|topped up|cashback|top up/i.test(name));
}
